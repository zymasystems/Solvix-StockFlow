name: Mobile app checks

on:
  push:
    paths:
      - "mobile/**"
      - "mobile-tests/**"
      - ".github/workflows/mobile-ci.yml"
  pull_request:
    paths:
      - "mobile/**"
      - "mobile-tests/**"
      - ".github/workflows/mobile-ci.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: mobile-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  unit-tests:
    name: Inventory and workflow tests
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Install .NET 10
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Run mobile service tests
        run: dotnet test mobile-tests/Solvix.Sims.Tests.csproj --configuration Release --logger "trx;LogFileName=mobile-tests.trx"

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: mobile-unit-test-results
          path: mobile-tests/TestResults/*.trx
          if-no-files-found: ignore

  android-build:
    name: Build Android app
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Install Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Install .NET 10
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Install MAUI Android workload
        run: dotnet workload install maui-android

      - name: Restore Android app
        run: dotnet restore mobile/Solvix.Sims.csproj -p:TargetFramework=net10.0-android

      - name: Restore persistent Android signing key
        shell: bash
        env:
          ANDROID_RELEASE_KEYSTORE_BASE64: ${{ secrets.ANDROID_RELEASE_KEYSTORE_BASE64 }}
          ANDROID_RELEASE_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_RELEASE_KEYSTORE_PASSWORD }}
        run: |
          if [[ -z "$ANDROID_RELEASE_KEYSTORE_BASE64" || -z "$ANDROID_RELEASE_KEYSTORE_PASSWORD" ]]; then
            echo "::error::Add ANDROID_RELEASE_KEYSTORE_BASE64 and ANDROID_RELEASE_KEYSTORE_PASSWORD Actions secrets before building the Android package."
            exit 1
          fi
          umask 077
          printf '%s' "$ANDROID_RELEASE_KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/solvix-release.keystore"

      - name: Build Android app
        env:
          ANDROID_RELEASE_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_RELEASE_KEYSTORE_PASSWORD }}
        run: dotnet build mobile/Solvix.Sims.csproj --configuration Release --no-restore -f net10.0-android -p:AndroidPackageFormats=apk -p:AndroidKeyStore=true -p:AndroidSigningKeyStore="$RUNNER_TEMP/solvix-release.keystore" -p:AndroidSigningKeyAlias=solvix-release -p:AndroidSigningKeyPass=env:ANDROID_RELEASE_KEYSTORE_PASSWORD -p:AndroidSigningStorePass=env:ANDROID_RELEASE_KEYSTORE_PASSWORD -p:ApplicationVersion=${{ github.run_number }}

      - name: Name installable APK
        shell: bash
        run: |
          apk_path="$(find mobile/bin/Release/net10.0-android -type f -name '*-Signed.apk' -print -quit)"
          if [[ -z "$apk_path" ]]; then
            apk_path="$(find mobile/bin/Release/net10.0-android -maxdepth 1 -type f -name '*.apk' ! -name 'base.apk' -print -quit)"
          fi
          if [[ -z "$apk_path" ]]; then
            echo "No installable Android APK was produced."
            exit 1
          fi
          cp "$apk_path" "mobile/bin/Release/net10.0-android/Solvix Sims.apk"

      - name: Smoke-test APK on Android x86_64 emulator
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          target: google_apis
          arch: x86_64
          profile: pixel_7
          disk-size: 4G
          ram-size: 2048M
          cores: 2
          emulator-boot-timeout: 300
          disable-animations: true
          script: |
            adb install "mobile/bin/Release/net10.0-android/Solvix Sims.apk"
            adb logcat -c
            adb shell monkey -p co.za.zyma.solvixsims 1
            for attempt in $(seq 1 30); do
              if adb shell pidof co.za.zyma.solvixsims >/dev/null; then
                break
              fi
              sleep 1
            done
            sleep 5
            if ! adb shell pidof co.za.zyma.solvixsims >/dev/null; then
              adb logcat -d -t 1200
              echo "The app process exited after launch."
              exit 1
            fi
            if adb logcat -d -s AndroidRuntime:E | grep -E 'FATAL EXCEPTION|TypeLoadException'; then
              echo "The app logged a fatal startup exception."
              exit 1
            fi

      - name: Upload Android APK
        uses: actions/upload-artifact@v4
        with:
          name: Solvix Sims APK
          path: mobile/bin/Release/net10.0-android/Solvix Sims.apk
          if-no-files-found: error
