name: Mobile app checks

on:
  push:
    paths:
      - "mobile/**"
      - "mobile-tests/**"
      - "shared/**"
      - ".github/workflows/mobile-ci.yml"
  pull_request:
    paths:
      - "mobile/**"
      - "mobile-tests/**"
      - "shared/**"
      - ".github/workflows/mobile-ci.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: mobile-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  unit-tests:
    name: Firebase authentication and HTTP tests
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Install .NET 10
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Run mobile service tests
        run: dotnet test mobile-tests/Solvix.Sims.Tests.csproj --configuration Release --logger "trx;LogFileName=mobile-tests.trx"

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: mobile-unit-test-results
          path: mobile-tests/TestResults/*.trx
          if-no-files-found: ignore

  android-build:
    name: Build Android app
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Install Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Install .NET 10
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Install MAUI Android workload
        run: dotnet workload install maui-android

      - name: Restore Android app
        run: dotnet restore mobile/Solvix.Sims.csproj -p:TargetFramework=net10.0-android

      # Pull requests build without production signing secrets. Release signing belongs in a separate release job.
      - name: Build Android debug APK
        run: dotnet build mobile/Solvix.Sims.csproj --configuration Debug --no-restore -f net10.0-android -p:AndroidPackageFormats=apk

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: Solvix-Android-Debug
          path: mobile/bin/Debug/net10.0-android/*-Signed.apk
          if-no-files-found: error
